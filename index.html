
<!DOCTYPE html>
<html>
<head>
    <title>Online Book Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Online Book Management System</h1>
        <p class="subtitle">Manage your book collection easily</p>

        <div id="message"></div>

        <div class="form-box">
            <h2>Add / Update Book</h2>

            <form id="bookForm">
                <input type="hidden" id="bookId">

                <input type="text" id="title"
                    placeholder="Book Title" required>

                <input type="text" id="author"
                    placeholder="Author Name" required>

                <input type="number" id="price"
                    placeholder="Price (₹)" min="1" required>

                <button type="submit" id="submitBtn">Add Book</button>
                <button type="button" id="cancelBtn"
                    onclick="resetForm()">Cancel</button>
            </form>
        </div>

        <h2>Available Books</h2>

        <div id="bookList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
